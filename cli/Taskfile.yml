# https://taskfile.dev
#
# Tasks for the validatorctl CLI module. Run from this directory, or from the
# repo root as `task cli:<task>` — the root Taskfile includes this file.

version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the validatorctl binary into bin/
    cmds:
      - go build -o bin/validatorctl ./cmd/validatorctl

  install:
    desc: Install validatorctl into GOPATH/bin
    cmds:
      - go install ./cmd/validatorctl

  run:
    desc: 'Build and run: task run -- ir check schema.json --json'
    deps: [build]
    cmds:
      - ./bin/validatorctl {{.CLI_ARGS}}

  test:
    desc: Run tests
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  test:cover:
    desc: Report statement coverage
    cmds:
      - go test -coverprofile=cover.out ./...
      - go tool cover -func=cover.out | tail -1

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format the source
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail when the source is unformatted
    cmds:
      - |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

  lint:
    desc: Run golangci-lint (and staticcheck) when installed
    cmds:
      - |
        bin=$(command -v golangci-lint || echo "$(go env GOPATH)/bin/golangci-lint")
        [ -x "$bin" ] && "$bin" run ./... || echo "golangci-lint not installed; skipping"
      - |
        bin=$(command -v staticcheck || echo "$(go env GOPATH)/bin/staticcheck")
        [ -x "$bin" ] && "$bin" ./... || echo "staticcheck not installed; skipping"

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  ci:
    desc: The full gate for this module — format, vet, lint, race tests
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test:race

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin cover.out
