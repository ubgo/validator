# https://taskfile.dev
#
# Tasks for the validator module. Run them from this directory. Every module
# carries the same task names on purpose: `task test` means the same thing
# everywhere, so moving between ubgo modules costs no re-learning.

version: "3"

vars:
  PLATFORMS: linux/amd64 linux/arm64 darwin/arm64 windows/amd64 freebsd/amd64

includes:
  # The CLI module carries its own Taskfile; `task cli:build`, `task cli:ci`,
  # etc. proxy into it with the right working directory.
  cli:
    taskfile: ./cli/Taskfile.yml
    dir: ./cli
  # The TypeScript runtime; `task ts:ci` etc.
  ts:
    taskfile: ./ts/Taskfile.yml
    dir: ./ts
  # Proof module: third-party JSON Schema validator + Node round-trip.
  examples:
    taskfile: ./examples/Taskfile.yml
    dir: ./examples

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  test:
    desc: Run tests
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  test:cover:
    desc: Report statement coverage
    cmds:
      - go test -coverprofile=cover.out ./...
      - go tool cover -func=cover.out | tail -1

  test:cover:html:
    desc: Open the coverage report in a browser
    deps: [test:cover]
    cmds:
      - go tool cover -html=cover.out

  test:uncovered:
    desc: List functions below 100% coverage
    cmds:
      - go test -coverprofile=cover.out ./... > /dev/null
      - 'go tool cover -func=cover.out | grep -v "100.0%" || echo "everything is covered"'

  cover:
    desc: Statement coverage for BOTH modules
    cmds:
      - echo "── library"
      - task: test:cover
      - echo "── cli"
      - task: cli:test:cover

  bench:
    desc: Run benchmarks with allocation counts
    cmds:
      - go test -run "^$" -bench . -benchmem ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (and staticcheck) when installed
    cmds:
      # PATH first, then GOPATH/bin — `go install` puts binaries there but
      # shells often omit it, which silently skips an installed linter.
      # `cmd && cmd || echo` would swallow a real finding as if the tool were
      # missing, which is how three staticcheck findings once rode through a
      # green gate. Absence skips; a finding fails.
      - |
        bin=$(command -v golangci-lint || echo "$(go env GOPATH)/bin/golangci-lint")
        if [ -x "$bin" ]; then "$bin" run ./...; else echo "golangci-lint not installed; skipping"; fi
      - |
        bin=$(command -v staticcheck || echo "$(go env GOPATH)/bin/staticcheck")
        if [ -x "$bin" ]; then "$bin" ./...; else echo "staticcheck not installed; skipping"; fi

  fmt:
    desc: Format the source
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail when the source is unformatted
    cmds:
      - |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

  tidy:
    desc: Tidy go.mod and go.sum in both modules
    cmds:
      - go mod tidy
      - task: cli:tidy
      - task: examples:tidy

  doc:
    desc: Print the ir package's exported API
    cmds:
      - go doc -all ./ir

  doc:api:
    desc: Regenerate docs/API.md from the source (a test fails when it is stale)
    cmds:
      - go run ./internal/cmd/apidoc > docs/API.md

  deps:
    desc: Show this module's third-party dependencies
    cmds:
      - 'go list -deps ./... | grep "\." | grep -v ubgo/validator | sort -u || echo "none — stdlib only"'

  build:cross:
    desc: Cross-compile library + cli for every platform the README claims (the build IS the platform proof)
    cmds:
      - for: { var: PLATFORMS }
        cmd: |
          echo "── {{.ITEM}}"
          GOOS={{splitList "/" .ITEM | first}} GOARCH={{splitList "/" .ITEM | last}} go build ./...
          GOOS={{splitList "/" .ITEM | first}} GOARCH={{splitList "/" .ITEM | last}} go vet ./...
          (cd cli && GOOS={{splitList "/" .ITEM | first}} GOARCH={{splitList "/" .ITEM | last}} go build ./...)

  fuzz:
    desc: 'Run every fuzz target briefly (FUZZTIME=30s to change); the untrusted-input surfaces: IR decode, interpreter map input, HTTP handler'
    vars:
      FUZZTIME: '{{.FUZZTIME | default "20s"}}'
    cmds:
      # One target per invocation: `go test -fuzz` accepts a single pattern.
      # A crash writes its input to the package's testdata/fuzz, which is
      # committed so the failure becomes a permanent regression test.
      - go test -run xxx -fuzz 'FuzzDecodeSchema$' -fuzztime {{.FUZZTIME}} ./ir/
      - go test -run xxx -fuzz 'FuzzDecodeType$' -fuzztime {{.FUZZTIME}} ./ir/
      - go test -run xxx -fuzz 'FuzzValidateMap$' -fuzztime {{.FUZZTIME}} ./interp/
      - go test -run xxx -fuzz 'FuzzCompileSchema$' -fuzztime {{.FUZZTIME}} ./interp/
      - go test -run xxx -fuzz 'FuzzServeHTTP$' -fuzztime {{.FUZZTIME}} ./rulehttp/
      - go test -run xxx -fuzz 'FuzzServeHTTPPaths$' -fuzztime {{.FUZZTIME}} ./rulehttp/

  vuln:
    desc: Scan every module for known vulnerabilities (govulncheck)
    # Deliberately NOT part of `task ci`: a newly published CVE would turn
    # the code gate red without a code change, which trains people to ignore
    # it. It runs as its own CI job (manual dispatch) instead, so the signal
    # stays loud and the gate stays deterministic.
    cmds:
      # Not "skip when missing" like the linters: a vulnerability scan that
      # silently does not run is worse than none, because the green gate
      # reads as "checked".
      - |
        bin=$(command -v govulncheck || echo "$(go env GOPATH)/bin/govulncheck")
        if [ ! -x "$bin" ]; then
          echo "installing govulncheck"
          go install golang.org/x/vuln/cmd/govulncheck@latest
          bin="$(go env GOPATH)/bin/govulncheck"
        fi
        "$bin" ./...
        (cd cli && "$bin" ./...)
        (cd examples && "$bin" ./...)

  cel:test:
    desc: Test the CEL module (separate module, cel-go lives there and nowhere else)
    dir: cel
    cmds:
      - go build ./...
      - go vet ./...
      - go test -race ./...
      - |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

  ci:min:
    desc: >-
      The gate for the modules consumers actually import (library, cli, cel),
      at the minimum supported Go. The examples module is excluded on purpose:
      its proof dependencies may require a newer Go than this project's
      floor. Proof code may need a
      newer toolchain; the published floor must not.
    cmds:
      - task: fmt:check
      - task: vet
      - task: test:race
      - task: cli:ci
      - task: cel:test

  ci:
    desc: The full gate — library, cli, ts AND the proof module — format, vet, lint, race tests, fuzz smoke, ts typecheck+tests+build, external proofs
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test:race
      # Short by design: the gate proves the targets still hold their
      # invariants on every push; `task fuzz FUZZTIME=5m` is the deep run.
      - task: fuzz
        vars: { FUZZTIME: 10s }
      - task: cli:ci
      - task: cel:test
      - task: ts:ci
      # After ts:ci on purpose: the round-trip proof runs the built ts/dist.
      - task: examples:ci

  clean:
    desc: Remove coverage artifacts
    cmds:
      - rm -f cover.out cover.html
      - task: cli:clean
      - task: ts:clean
