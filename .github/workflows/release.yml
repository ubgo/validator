# Tag-driven release: builds validatorctl for every supported platform and
# attaches the binaries to the GitHub release; publishes @ubgo/validator to
# npm with provenance when NPM_TOKEN is configured, otherwise runs a dry
# run so the package is still verified to pack. Tags: v1.2.3.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

env:
  GO_VERSION: "1.26.4"
  NODE_VERSION: "22"

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          cd cli
          go build -trimpath -ldflags="-s -w" -o "../validatorctl-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/validatorctl
      - uses: softprops/action-gh-release@v2
        with:
          files: validatorctl-*

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: Build
        working-directory: ts
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run test
          pnpm run build
      - name: Set version from tag
        working-directory: ts
        run: pnpm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - name: Publish (dry run without NPM_TOKEN)
        working-directory: ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            pnpm publish --access public --provenance --no-git-checks
          else
            echo "NPM_TOKEN not set; verifying the package packs instead of publishing"
            pnpm publish --dry-run --access public --no-git-checks
          fi
