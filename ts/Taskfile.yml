# https://taskfile.dev
#
# Tasks for the @ubgo/validator TypeScript runtime. Run from this directory
# or from the repo root as `task ts:<task>`. Same verb names as the Go
# modules on purpose.

version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies (pnpm, frozen lockfile when present)
    cmds:
      - pnpm install

  build:
    desc: Compile src/ to dist/
    cmds:
      - pnpm run build

  fixtures:
    desc: Copy the Go-emitted TypeScript schema golden into test/fixtures (run after UPDATE_GOLDEN in jsonschema)
    cmds:
      - cp ../jsonschema/testdata/user.schema.ts test/fixtures/user.schema.ts

  typecheck:
    desc: Type-check src and tests without emitting
    cmds:
      - pnpm run typecheck

  test:
    desc: Run the vitest suite once
    cmds:
      - pnpm run test

  test:cover:
    desc: Run tests with v8 coverage and the configured thresholds
    cmds:
      - pnpm run test:cover

  ci:
    desc: The full gate for this package — typecheck + coverage-thresholded tests + build
    cmds:
      - task: typecheck
      - task: test:cover
      - task: build

  clean:
    desc: Remove build and coverage artifacts
    cmds:
      - pnpm run clean
